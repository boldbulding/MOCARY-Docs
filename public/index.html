<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - MOCARY SA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=4">
</head>
<body class="login-body">
    <div class="login-wrap">
        <div class="login-card">
            <div class="login-logo">
                <div class="logo-mark">M</div>
            </div>
            <h1>MOCARY SA</h1>
            <p class="login-sub">TAPIS NOUÉS MAIN-ARTISANAT</p>
            <form id="loginForm">
                <div class="login-field">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="votre@email.com" autocomplete="username" required>
                </div>
                <div class="login-field">
                    <label for="mot_de_passe">Mot de passe</label>
                    <input type="password" id="mot_de_passe" placeholder="••••••••" autocomplete="current-password" required>
                </div>
                <div id="error" class="login-error" style="display:none"></div>
                <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Se connecter</button>
            </form>
        </div>
    </div>

    <script src="js/api.js?v=3"></script>
    <script>
        if (isLoggedIn()) window.location.href = 'documents.html';

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const errEl = document.getElementById('error');
            btn.disabled = true;
            errEl.style.display = 'none';
            try {
                const data = await apiCall('/auth/login', {
                    method: 'POST',
                    body: JSON.stringify({
                        email: document.getElementById('email').value.trim(),
                        mot_de_passe: document.getElementById('mot_de_passe').value
                    })
                });
                setToken(data.token);
                setUser(data.user);
                window.location.href = 'documents.html';
            } catch (err) {
                errEl.textContent = err.message;
                errEl.style.display = 'block';
            } finally {
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
