<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Factures & Devis - MOCARY SA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=4">
</head>
<body>
    <header class="header">
        <div class="brand">
            <div class="logo-mark">M</div>
            <div>
                <span class="brand-name">MOCARY SA</span>
                <span class="brand-sub">TAPIS NOUÉS MAIN-ARTISANAT — GESTION FACTURES & DEVIS</span>
            </div>
        </div>
        <div class="header-actions">
            <a href="form.html?type=devis" class="btn btn-dark">+ Nouveau devis</a>
            <a href="form.html?type=facture" class="btn btn-primary" style="border-color:var(--accent)">+ Nouvelle facture</a>
            <button class="btn btn-sm" onclick="logout()">Déconnexion</button>
        </div>
    </header>

    <main>
        <div class="card">
            <div class="tabs">
                <button class="tab active" data-t="" onclick="charge('')">Tout</button>
                <button class="tab" data-t="devis" onclick="charge('devis')">Devis</button>
                <button class="tab" data-t="facture" onclick="charge('facture')">Factures</button>
            </div>
            <div class="filters">
                <input type="text" id="filterCommercial" placeholder="Filtrer par nom du commercial...">
                <input type="text" id="search" placeholder="Rechercher (n°, client, ICE)...">
                <select id="filterEtat">
                    <option value="">Tous les états</option>
                    <option value="brouillon">Brouillon</option>
                    <option value="emise">Émise</option>
                    <option value="validee">Validée</option>
                    <option value="annulee">Annulée</option>
                </select>
                <button class="btn btn-sm" onclick="loadDocs()">Filtrer</button>
                <button class="btn btn-sm btn-primary" id="excelBtn" onclick="exportExcel()">📥 Excel</button>
            </div>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Type</th>
                            <th>N°</th>
                            <th>Date</th>
                            <th>Client</th>
                            <th>ICE</th>
                            <th>Type client</th>
                            <th>Total (DHS)</th>
                            <th>État</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="docsTable"></tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="js/api.js?v=14"></script>
    <script src="js/list.js?v=14"></script>
</body>
</html>
